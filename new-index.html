<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- META:START (generated from wedding.json by inject-meta.py — do not edit by hand) -->
<title>Prakash Weds Keerthi — Wedding Invitation</title>
<meta name="description" content="Wedding invitation for Prakash and Keerthi on Thursday, 3 December 2026 at 9:03 PM at Tulasi Convention Hall, Peravali.">
<meta name="keywords" content="Prakash, Keerthi, Telugu wedding invitation, 3 December 2026">
<meta name="author" content="Sanaboyina family">
<meta name="theme-color" content="#4A121C">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Serif+Telugu:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#12143A;--deep:#1B1F5A;--lamp:#F5B83D;--kum:#D6303B;--jas:#FBF5E4;--mist:#B7BCE8;
--disp:'Fraunces','Noto Serif Telugu',serif;--body:'Figtree','Noto Sans Telugu',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--jas);font:400 1.0625rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
html[lang=te] body{line-height:1.95}
h1,h2,h3,.time{font-family:var(--disp);font-weight:500;margin:0}
:focus-visible{outline:3px solid var(--jas);outline-offset:3px}

.lang{position:fixed;top:14px;right:14px;z-index:5;font:600 .95rem var(--body);color:var(--jas);background:rgba(18,20,58,.7);
border:1.5px solid var(--lamp);border-radius:999px;padding:8px 16px;cursor:pointer;backdrop-filter:blur(6px)}
.lang:hover{background:var(--lamp);color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:76px 20px 56px;background:radial-gradient(120% 70% at 50% 0,#272C7E 0,var(--ink) 62%)}
.hero>*{position:relative;z-index:1}
.hero>.sky{position:absolute;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.55;animation:tw 5s ease-in-out infinite}
@keyframes tw{50%{opacity:.08}}
.moon{position:absolute;top:64px;left:9%;width:42px;height:42px;border-radius:50%;box-shadow:inset -13px 0 0 0 var(--jas);transform:rotate(18deg);opacity:.85}
.invite{color:var(--lamp);font:300 1.1rem var(--disp);margin:0 0 14px}
h1{font-size:clamp(2.7rem,12vw,5.6rem);line-height:1;letter-spacing:-.02em}
h1 .and{display:block;font-size:.3em;font-weight:300;font-style:italic;color:var(--mist);margin:.2em 0}
html[lang=te] h1 .and{font-style:normal}
.dial{width:min(80vw,380px);margin:26px auto 2px}
.dial svg{display:block;width:100%;height:auto;overflow:visible}
.ring{fill:none;stroke:var(--lamp);stroke-opacity:.4}
.tick{stroke:var(--mist);stroke-opacity:.45}
.lamp{fill:var(--deep);stroke:var(--lamp);stroke-width:2;transition:fill .35s,filter .35s}
.lamp.lit{fill:var(--lamp);filter:drop-shadow(0 0 7px var(--lamp))}
.bindi{fill:var(--kum)}
.bindi.pulse{animation:pulse 1.4s ease-out 1}
@keyframes pulse{0%{filter:drop-shadow(0 0 0 var(--kum))}40%{filter:drop-shadow(0 0 16px var(--kum))}100%{filter:none}}
.time{font-size:clamp(4.6rem,24vw,9.5rem);line-height:1;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.time small{font-size:.26em;letter-spacing:.02em;margin-left:.2em;color:var(--lamp)}
.time.done{animation:glow 1.8s ease-out 1}
@keyframes glow{0%{text-shadow:0 0 0 var(--lamp)}40%{text-shadow:0 0 42px var(--lamp)}100%{text-shadow:none}}
.when{margin:6px 0 0;font-size:1.2rem}

/* sections */
.band{padding:76px 22px;text-align:center}
.band.alt{background:var(--deep)}
.in{max-width:680px;margin:0 auto}
h2{font-size:clamp(1.7rem,6vw,2.4rem);margin-bottom:16px}
.bless{font:italic 300 clamp(1.25rem,4.4vw,1.6rem)/1.6 var(--disp);margin:0}
html[lang=te] .bless{font-style:normal}
.cd{display:flex;justify-content:center;gap:clamp(14px,4vw,34px);margin:24px 0 6px}
.cd div{min-width:3.4em}
.cd b{display:block;font:300 clamp(2.3rem,9vw,3.5rem)/1 var(--disp);font-variant-numeric:tabular-nums}
.cd span{font-size:.88rem;color:var(--mist)}
.cdone{font:300 1.4rem var(--disp);margin:0}

.track{position:relative;height:136px;margin:36px 30px 0}
.rail,.fill{position:absolute;left:0;top:18px;height:3px;border-radius:2px}
.rail{right:0;background:#3A3F8C}
.fill{width:0;background:var(--lamp);transition:width 2.4s cubic-bezier(.3,.1,.2,1)}
.mk{position:absolute;top:8px;transform:translateX(-50%);width:108px;font-size:.92rem;line-height:1.35}
.mk i{display:block;width:22px;height:22px;margin:0 auto 10px;border-radius:50%;background:var(--ink);border:3px solid var(--lamp)}
.mk.main i{background:var(--kum);box-shadow:0 0 18px var(--kum)}
.mk b{display:block;font:500 1.3rem var(--disp)}
.mk span{color:var(--mist)}

.fam{margin:28px 0 0}
.fam h3{font-size:1.6rem;margin-bottom:2px}
.fam p{margin:0;color:var(--mist)}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px;text-align:left}
.photo{margin:0;overflow:hidden;border:1px solid rgba(245,184,61,.28);border-radius:16px;background:rgba(255,255,255,.04)}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--deep)}
.photo figcaption{padding:10px 12px;color:var(--mist);font-size:.9rem}
.photo .empty-photo{display:grid;place-items:center;aspect-ratio:4/3;padding:12px;color:var(--mist);background:var(--deep);font-size:.85rem}

.vname{font:500 clamp(1.8rem,7vw,2.7rem)/1.15 var(--disp);margin:0 0 6px}
.vaddr{margin:0;color:var(--mist)}
.map{display:block;width:100%;height:280px;border:0;border-radius:18px;margin-top:26px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.btn{font:600 1rem var(--body);color:var(--ink);background:var(--lamp);border:2px solid var(--lamp);padding:12px 22px;border-radius:999px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--lamp)}
.btn:hover{background:var(--jas);border-color:var(--jas);color:var(--ink)}
.calls{margin-top:30px}
.calls p{margin:0 0 4px;color:var(--mist)}
footer{padding:44px 22px 64px;text-align:center;color:var(--mist);font-size:.95rem}
footer p{max-width:520px;margin:0 auto}
.err{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px;background:var(--kum);color:#fff;text-align:center;font-size:.95rem}
[hidden]{display:none!important}
@media(max-width:480px){.photos{gap:10px}.photo figcaption{padding:8px;font-size:.82rem}.band{padding:56px 18px}}
@media (prefers-reduced-motion:reduce){.star,.time.done,.bindi.pulse{animation:none}.fill{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<button class="lang" id="lang" type="button"></button>

<header class="hero">
  <div class="sky" id="sky"><i class="moon"></i></div>
  <p class="invite" id="invite"></p>
  <h1 id="names"></h1>
  <div class="dial" id="dial" role="img"></div>
  <p class="time" id="time"></p>
  <p class="when" id="when"></p>
</header>

<section class="band">
  <div class="in">
    <p class="bless" id="blessing"></p>
  </div>
</section>

<section class="band alt">
  <div class="in">
    <h2 id="cd-title"></h2>
    <div class="cd" id="cd"></div>
    <p class="cdone" id="cd-done" hidden></p>
  </div>
</section>

<section class="band" id="track-sec">
  <div class="in">
    <h2 id="track-title"></h2>
    <div class="track" id="track"><div class="rail"></div><div class="fill" id="fill"></div></div>
  </div>
</section>

<section class="band alt">
  <div class="in">
    <h2 id="fam-title"></h2>
    <div id="families"></div>
  </div>
</section>

<section class="band" id="gallery-sec" hidden>
  <div class="in">
    <h2 id="gallery-title"></h2>
    <p id="gallery-subtitle" class="vaddr"></p>
    <div class="photos" id="photos"></div>
  </div>
</section>

<section class="band">
  <div class="in">
    <h2 id="v-title"></h2>
    <p class="vname" id="v-name"></p>
    <p class="vaddr" id="v-addr"></p>
    <iframe class="map" id="v-frame" hidden loading="lazy" title="Venue map"></iframe>
    <div class="btns"><a class="btn" id="v-map" target="_blank" rel="noopener noreferrer"></a></div>
  </div>
</section>

<section class="band alt">
  <div class="in">
    <div class="btns" style="margin-top:0">
      <button class="btn" id="cal" type="button"></button>
      <a class="btn ghost" id="wa" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <div class="calls">
      <p id="c-title"></p>
      <div class="btns" id="calls"></div>
    </div>
  </div>
</section>

<footer><p id="foot"></p></footer>

<script>
(function(){
  let D, lang = 'en', timer;
  const $ = (id) => document.getElementById(id);
  const t = (x) => (x && typeof x === 'object') ? (x[lang] || x.en || '') : (x || '');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  fetch('wedding.json', { cache: 'no-cache' })
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(start)
    .catch(err => {
      console.error(err);
      const e = document.createElement('div');
      e.className = 'err';
      e.textContent = 'Could not load wedding.json. Serve this folder over http(s) (GitHub Pages, or python3 -m http.server); browsers block fetch() on file://.';
      document.body.appendChild(e);
    });

  /* ---------- head: title, description, OG, Twitter ---------- */
  function upsert(attr, key, val){
    if(!val) return;
    let el = document.head.querySelector('meta[' + attr + '="' + key + '"]');
    if(!el){ el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
    el.setAttribute('content', val);
  }
  function applyMeta(M){
    const abs = u => u ? new URL(u, M.siteUrl || location.href).href : '';
    const og = M.og || {}, tw = M.twitter || {};
    document.title = M.title;
    upsert('name','description',M.description); upsert('name','keywords',M.keywords);
    upsert('name','author',M.author); upsert('name','theme-color',M.themeColor);
    if(M.siteUrl){
      let l = document.head.querySelector('link[rel=canonical]');
      if(!l){ l = document.createElement('link'); l.rel = 'canonical'; document.head.appendChild(l); }
      l.href = M.siteUrl; upsert('property','og:url',M.siteUrl);
    }
    ['type','title','description'].forEach(k => upsert('property','og:' + k, og[k]));
    upsert('property','og:image',abs(og.image)); upsert('property','og:image:alt',og.imageAlt);
    upsert('property','og:site_name',og.siteName); upsert('property','og:locale',og.locale);
    ['card','title','description'].forEach(k => upsert('name','twitter:' + k, tw[k]));
    upsert('name','twitter:image',abs(tw.image)); upsert('name','twitter:image:alt',tw.imageAlt);
  }

  /* ---------- helpers ---------- */
  const toMin = s => { const a = s.split(':'); return +a[0] * 60 + +a[1]; };
  const fmt12 = s => { const m = toMin(s), h = Math.floor(m / 60), mm = String(m % 60).padStart(2,'0'); return ((h % 12) || 12) + ':' + mm + ' ' + (h >= 12 ? 'PM' : 'AM'); };
  const mapsHref = v => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((v.lat != null && v.lng != null) ? v.lat + ',' + v.lng : v.mapQuery);

  function normalizeWedding(raw){
    const ceremony = raw.events.ceremony;
    const reception = raw.events.reception || raw.events.reception1;
    const start = raw.hero.weddingDateISO;
    const clock = start.match(/T(\d{2}):(\d{2})/);
    const toClock = text => {
      const m = (text || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if(!m) return null;
      let h = Number(m[1]) % 12;
      if(m[3].toUpperCase() === 'PM') h += 12;
      return String(h).padStart(2,'0') + ':' + m[2];
    };
    const d = raw.couple, f = raw.families, v = ceremony.venue;
    const weddingDate = (raw.hero.displayDate || '').split(' · ')[0];
    const items = [];
    if(reception && reception.enabled !== false){
      const dinnerTime = toClock(reception.displayDate);
      if(dinnerTime) items.push({time:dinnerTime,label:{en:reception.title,te:'విందు'}});
      items.push({time:clock[1] + ':' + clock[2],label:{en:ceremony.title,te:'వివాహ ముహూర్తం'}});
      items.sort((a,b) => toMin(a.time) - toMin(b.time));
    }
    const ceremonyTime = clock[1] + ':' + clock[2];
    const minTime = items.length ? Math.max(0, toMin(items[0].time) - 30) : 0;
    const maxTime = items.length ? Math.min(1439, toMin(items[items.length - 1].time) + 30) : 1439;
    const clockString = n => String(Math.floor(n / 60)).padStart(2,'0') + ':' + String(n % 60).padStart(2,'0');
    const familyItems = [
      {name:{en:"Groom's parents",te:'వరుడి తల్లిదండ్రులు'},text:f.groomParents},
      {name:{en:"Bride's parents",te:'వధువు తల్లిదండ్రులు'},text:f.brideParents + ' · ' + f.brideFamilyAddress},
      {name:{en:'Invitation from',te:'ఆహ్వానించువారు'},text:f.invitingFamily + ' · ' + f.invitingFamilyTelugu}
    ];
    return {
      meta:raw.meta, defaultLang:'en',
      ui:{
        langButton:{en:'తెలుగు',te:'English'},langButtonLabel:{en:'Switch language to Telugu',te:'Switch language to English'},
        openMap:{en:'Open map',te:'మ్యాప్ చూడండి'},addCalendar:{en:'Add to calendar',te:'క్యాలెండర్‌లో చేర్చండి'},
        shareWhatsApp:{en:'Share on WhatsApp',te:'WhatsApp లో పంచుకోండి'},shareText:{en:'Wedding invitation',te:'వివాహ ఆహ్వానం'},
        call:{en:'Call',te:'ఫోన్ చేయండి'},
      },
      invite:{en:raw.hero.eyebrow,te:f.invitingFamilyTelugu},
      couple:{
        p1:{en:d.partner1,te:d.partner1Telugu || d.partner1},
        connector:{en:d.connector,te:'వివాహం'},
        p2:{en:d.partner2,te:d.partner2Telugu || d.partner2}
      },
      event:{
        start, hour24:Number(clock[1]),minute:Number(clock[2]),durationHours:3,
        dateText:{en:weddingDate,te:'3 డిసెంబర్ 2026'},
        dialLabel:{en:'Wedding muhurtham at ' + raw.hero.displayDate,te:'వివాహ ముహూర్త సమయం'},
        summary:{en:d.partner1 + ' ' + d.connector + ' ' + d.partner2,te:(d.partner1Telugu || d.partner1) + ' ' + (d.partner2Telugu || d.partner2)}
      },
      blessing:{en:raw.hero.subtitle,te:'వారి వివాహ వేడుకకు మీకు సాదర ఆహ్వానం'},
      countdown:{
        title:{en:'Until the wedding',te:'వివాహానికి మిగిలిన సమయం'},done:{en:'The celebration has begun.',te:'వేడుక ప్రారంభమైంది.'},
        units:{d:{en:'days',te:'రోజులు'},h:{en:'hours',te:'గంటలు'},m:{en:'mins',te:'నిమిషాలు'},s:{en:'secs',te:'సెకన్లు'}}
      },
      track:{
        title:{en:'Wedding schedule',te:'వేడుకల సమయం'},from:clockString(minTime),to:clockString(maxTime),items,
        highlight:Math.max(0,items.findIndex(x => x.time === ceremonyTime))
      },
      families:{title:{en:f.title,te:'కుటుంబ సభ్యులు'},items:familyItems},
      venue:{title:{en:raw.venueSection.title,te:'వేదిక మరియు చిరునామా'},name:v.name,address:v.address,lat:v.lat,lng:v.lng,mapQuery:v.name + ', ' + v.address},
      gallery:{title:raw.gallery.title,subtitle:raw.gallery.subtitle,photos:raw.gallery.photos || []},
      contacts:{title:{en:'Questions? Call the family',te:'వివరాలకు సంప్రదించండి'},items:(raw.sender.phones || []).map(phone => ({phone,label:{en:'Family contact',te:'కుటుంబ సంప్రదింపు'}}))},
      footer:{en:raw.footer.script + ' ' + f.invitingFamily + ' · ' + raw.sender.address,te:f.invitingFamilyTelugu + ' · ' + raw.sender.address}
    };
  }

  /* ---------- the dial: the one big moment ---------- */
  const C = 200;
  function buildDial(){
    let s = '<svg viewBox="0 0 400 400" aria-hidden="true"><circle class="ring" cx="200" cy="200" r="190"/><circle class="ring" cx="200" cy="200" r="148" stroke-opacity=".18"/>';
    for(let i = 0; i < 60; i++){
      const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = 148, r2 = big ? 132 : 140;
      s += '<line class="tick" stroke-width="' + (big ? 2 : 1) + '" x1="' + (C + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (C - r1 * Math.cos(a)).toFixed(1) +
           '" x2="' + (C + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (C - r2 * Math.cos(a)).toFixed(1) + '"/>';
    }
    for(let h = 1; h <= 12; h++){
      const a = h * 30 * Math.PI / 180;
      s += '<circle class="lamp" data-h="' + h + '" cx="' + (C + 169 * Math.sin(a)).toFixed(1) + '" cy="' + (C - 169 * Math.cos(a)).toFixed(1) + '" r="8"/>';
    }
    s += '<line id="hh" x1="200" y1="200" x2="200" y2="112" stroke="#FBF5E4" stroke-width="7" stroke-linecap="round"/>' +
         '<line id="mh" x1="200" y1="200" x2="200" y2="68" stroke="#F5B83D" stroke-width="3.5" stroke-linecap="round"/>' +
         '<circle class="bindi" id="bindi" cx="200" cy="200" r="10"/></svg>';
    $('dial').innerHTML = s;
  }
  function setClock(totalMin){
    $('hh').setAttribute('transform', 'rotate(' + (totalMin * .5) + ' 200 200)');
    $('mh').setAttribute('transform', 'rotate(' + (totalMin * 6) + ' 200 200)');
    document.querySelectorAll('.lamp').forEach(l => l.classList.toggle('lit', +l.dataset.h * 60 <= totalMin + .01));
    const h = Math.floor(totalMin / 60) % 12 || 12, m = Math.floor(totalMin % 60);
    $('tnum').textContent = h + ':' + String(m).padStart(2,'0');
  }
  function runClock(){
    const ev = D.event;
    const end = (ev.hour24 % 12) * 60 + ev.minute;  /* minutes past 12:00 on the dial */
    const done = () => { setClock(end); $('time').classList.add('done'); $('bindi').classList.add('pulse'); };
    if(reduce){ done(); return; }
    const dur = 3600, t0 = performance.now();
    const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    (function tick(now){
      const p = Math.min(1, (now - t0) / dur);
      if(p < 1){ setClock(end * ease(p)); requestAnimationFrame(tick); } else done();
    })(t0);
  }

  /* ---------- text that depends on language ---------- */
  function render(){
    document.documentElement.lang = lang;
    const U = D.ui, c = D.couple;
    $('lang').textContent = t(U.langButton);
    $('lang').setAttribute('aria-label', t(U.langButtonLabel));
    $('invite').textContent = t(D.invite);
    const h1 = $('names'); h1.textContent = '';
    [c.p1, c.connector, c.p2].forEach((x, i) => {
      const e = document.createElement('span');
      if(i === 1) e.className = 'and'; else e.style.display = 'block';
      e.textContent = t(x); h1.appendChild(e);
    });
    $('dial').setAttribute('aria-label', t(D.event.dialLabel));
    $('when').textContent = t(D.event.dateText);
    $('blessing').textContent = t(D.blessing);

    $('cd-title').textContent = t(D.countdown.title);
    $('cd-done').textContent = t(D.countdown.done);
    tickCountdown();

    $('track-title').textContent = t(D.track.title);
    $('track-sec').hidden = !D.track.items.length;
    $('fam-title').textContent = t(D.families.title);
    const fam = $('families'); fam.textContent = '';
    D.families.items.forEach(f => {
      const w = document.createElement('div'); w.className = 'fam';
      const h = document.createElement('h3'); h.textContent = t(f.name);
      const p = document.createElement('p'); p.textContent = t(f.text);
      w.append(h, p); fam.appendChild(w);
    });

    $('gallery-title').textContent = t(D.gallery.title);
    $('gallery-subtitle').textContent = t(D.gallery.subtitle);
    const gallery = $('photos'); gallery.textContent = '';
    $('gallery-sec').hidden = !D.gallery.photos.length;
    D.gallery.photos.forEach(photo => {
      const fig = document.createElement('figure'); fig.className = 'photo';
      const img = document.createElement('img'); img.src = photo.url; img.alt = photo.caption || '';
      img.loading = 'lazy';
      img.addEventListener('error', () => {
        const placeholder = document.createElement('div'); placeholder.className = 'empty-photo';
        placeholder.textContent = photo.url;
        img.replaceWith(placeholder);
      }, {once:true});
      const cap = document.createElement('figcaption'); cap.textContent = photo.caption || '';
      fig.append(img, cap); gallery.appendChild(fig);
    });

    $('v-title').textContent = t(D.venue.title);
    $('v-name').textContent = t(D.venue.name);
    $('v-addr').textContent = t(D.venue.address);
    $('v-map').textContent = t(U.openMap);
    $('v-map').href = mapsHref(D.venue);
    const V = D.venue, fr = $('v-frame');
    if(V.lat != null && V.lng != null){ fr.src = 'https://www.google.com/maps?q=' + V.lat + ',' + V.lng + '&z=16&output=embed'; fr.title = t(V.name); fr.hidden = false; }
    $('cal').textContent = t(U.addCalendar);
    $('wa').textContent = t(U.shareWhatsApp);
    $('wa').href = 'https://wa.me/?text=' + encodeURIComponent(t(U.shareText) + ' — ' + t(D.event.dateText) + ' — ' + t(D.venue.name) + '\n' + location.href);

    $('c-title').textContent = t(D.contacts.title);
    const calls = $('calls'); calls.textContent = '';
    D.contacts.items.forEach(k => {
      const a = document.createElement('a'); a.className = 'btn ghost'; a.href = 'tel:+91' + k.phone;
      a.textContent = t(U.call) + ' ' + k.phone; a.title = t(k.label); calls.appendChild(a);
    });
    $('foot').textContent = t(D.footer);
    buildTrack(false);
  }

  /* ---------- countdown ---------- */
  function tickCountdown(){
    const diff = new Date(D.event.start).getTime() - Date.now(), box = $('cd');
    if(diff <= 0){ box.hidden = true; $('cd-done').hidden = false; clearInterval(timer); return; }
    const s = Math.floor(diff / 1000), v = { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
    box.textContent = '';
    ['d','h','m','s'].forEach(k => {
      const d = document.createElement('div'), b = document.createElement('b'), u = document.createElement('span');
      b.textContent = k === 'd' ? v[k] : String(v[k]).padStart(2,'0'); u.textContent = t(D.countdown.units[k]);
      d.append(b, u); box.appendChild(d);
    });
  }

  /* ---------- evening track ---------- */
  function buildTrack(animate){
    const T = D.track, tr = $('track'), a = toMin(T.from), z = toMin(T.to);
    tr.querySelectorAll('.mk').forEach(n => n.remove());
    if(!T.items.length) return;
    T.items.forEach((it, i) => {
      const pct = Math.max(0, Math.min(100, (toMin(it.time) - a) / (z - a) * 100));
      const m = document.createElement('div'); m.className = 'mk' + (i === T.highlight ? ' main' : ''); m.style.left = pct + '%';
      m.innerHTML = '<i></i><b></b><span></span>';
      m.children[1].textContent = fmt12(it.time); m.children[2].textContent = t(it.label);
      tr.appendChild(m);
    });
    const hi = T.items[T.highlight];
    $('fill').dataset.to = Math.max(0, Math.min(100, (toMin(hi.time) - a) / (z - a) * 100));
    if(!animate && $('fill').dataset.on) $('fill').style.width = $('fill').dataset.to + '%';
  }
  function watchTrack(){
    const f = $('fill');
    const go = () => { f.dataset.on = 1; f.style.width = f.dataset.to + '%'; };
    if(reduce || !('IntersectionObserver' in window)){ go(); return; }
    new IntersectionObserver((es, ob) => { if(es[0].isIntersecting){ go(); ob.disconnect(); } }, { threshold: .6 }).observe($('track'));
  }

  /* ---------- calendar file ---------- */
  function addToCalendar(){
    const s = new Date(D.event.start), e = new Date(s.getTime() + D.event.durationHours * 3600e3);
    const z = d => d.toISOString().replace(/[-:]|\.\d{3}/g, '');
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Invitation//EN','BEGIN:VEVENT','UID:' + z(s) + '@invitation',
      'DTSTAMP:' + z(new Date()),'DTSTART:' + z(s),'DTEND:' + z(e),'SUMMARY:' + t(D.event.summary),
      'LOCATION:' + t(D.venue.name) + ', ' + t(D.venue.address),'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'wedding.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- start ---------- */
  function start(data){
    D = normalizeWedding(data); lang = D.defaultLang || 'en';
    applyMeta(D.meta);
    const sky = $('sky');
    for(let i = 0; i < 70; i++){
      const s = document.createElement('i'); s.className = 'star';
      s.style.cssText = 'left:' + Math.random() * 100 + '%;top:' + Math.random() * 100 + '%;animation-delay:' + (Math.random() * 5).toFixed(1) + 's';
      sky.appendChild(s);
    }
    $('time').innerHTML = '<span id="tnum">12:00</span><small></small>';
    $('time').lastChild.textContent = D.event.hour24 >= 12 ? 'PM' : 'AM';
    buildDial(); render(); watchTrack(); runClock();
    timer = setInterval(tickCountdown, 1000);
    $('lang').addEventListener('click', () => { lang = lang === 'en' ? 'te' : 'en'; render(); });
    $('cal').addEventListener('click', addToCalendar);
  }
})();
</script>
</body>
</html>
