      margin:10px auto 0;
      font-size:clamp(.88rem,3.8vw,1rem);
      line-height:1.45;
    }
    .hero .hero-date{
      display:block;
      width:100%;
      max-width:100%;
      margin:0 auto;
      padding:12px clamp(10px,3vw,18px);
      font-size:clamp(1.65rem,5.2vw,2.1rem);
      line-height:1.28;
      letter-spacing:0;
      overflow-wrap:anywhere;
    }
    .countdown{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      width:min(100%,340px);
      margin:18px auto 0;
    }
    .cd-box{min-width:0;padding:12px 8px}
    .cd-box .num{font-size:clamp(1.8rem,8vw,2.1rem)}
    .cd-box .lbl{font-size:.58rem;letter-spacing:.12em}
    .scroll-cue{margin-top:24px;font-size:.62rem;letter-spacing:.12em}
    .section,.gallery-wrap{padding:48px 16px}
    .section-head{margin-bottom:28px}
    .event-card{max-width:100%;padding:14px 16px}
    #venue h3.event-card{max-width:100% !important;padding:12px 14px !important;font-size:1.08rem !important}
    .map-card iframe{height:280px}
    .btn{max-width:100%;white-space:normal;text-align:center}
    .lightbox{padding:16px}
  }

  @media (max-width:360px){
    .hero{padding-inline:12px}
    .hero-names{font-size:2.15rem}
    .hero-date{font-size:1.65rem !important}
    .gallery-wrap{padding-inline:12px}
  }

</style>
</head>
<body>

<!-- ============================================================
     CONFIG lives in wedding.json (loaded by the script at the bottom)
     ============================================================ -->

<!-- ============================================================
     HERO
     ============================================================ -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-wheel">
      <svg class="hero-eyebrow-arc" id="hero-eyebrow-arc" viewBox="0 0 400 400" role="img" aria-label="">
        <defs>
          <path id="hero-eyebrow-path" d="M 20 200 A 180 180 0 0 1 380 200"/>
          <clipPath id="hero-eyebrow-clip" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="0" height="400"/></clipPath>
        </defs>
        <text text-anchor="middle" clip-path="url(#hero-eyebrow-clip)"><textPath id="hero-eyebrow" href="#hero-eyebrow-path" startOffset="50%"></textPath></text>
      </svg>
      <h1 class="hero-names"><span id="hero-p1"></span><span class="amp"></span><span id="hero-p2"></span></h1>
    </div>
    <div class="hero-details">
      <p class="hero-sub" id="hero-sub"></p>
      <p class="hero-date" id="hero-date"></p>

      <div class="countdown" id="countdown">
        <div class="cd-box"><span class="num" id="cd-d">--</span><span class="lbl">Days</span></div>
        <div class="cd-box"><span class="num" id="cd-h">--</span><span class="lbl">Hours</span></div>
        <div class="cd-box"><span class="num" id="cd-m">--</span><span class="lbl">Mins</span></div>
        <div class="cd-box"><span class="num" id="cd-s">--</span><span class="lbl">Secs</span></div>
      </div>

      <div class="scroll-cue" id="scroll-cue"></div>
    </div>
  </div>
</section>

<!-- ============================================================
     PRE-WEDDING SHOOT
     ============================================================ -->
<section class="gallery-wrap">
  <div class="section-head">
    <span class="eyebrow" id="gallery-eyebrow"></span>
    <h2 id="gallery-title"></h2>
    <p id="gallery-subtitle"></p>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>

  <div class="teaser-wrap">
    <h3 class="teaser-heading" id="video-heading"></h3>

    <div class="video-preview">
      <a id="video-link" href="#"
         target="_blank"
         rel="noopener noreferrer">
        <img id="video-thumb" src="" alt="">
        <span class="video-play">▶</span>
      </a>
    </div>
  </div>

</section>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lightbox-nav prev" id="lb-prev" aria-label="Previous photo">‹</button>
  <div class="lightbox-inner">
    <img id="lb-img" src="" alt="">
    <figcaption id="lb-caption"></figcaption>
  </div>
  <button class="lightbox-nav next" id="lb-next" aria-label="Next photo">›</button>
</div>

<!-- ============================================================
     MAPS — WEDDING & RECEPTION
     ============================================================ -->
<section class="section" id="venue">
  <div class="section-head">
    <span class="eyebrow" id="venue-eyebrow"></span>
    <h2 id="venue-title"></h2>
  </div>

  <div style="margin-bottom:14px;">
    <h3 class="event-card"><span id="ceremony-icon"></span> <strong id="ceremony-heading"></strong></h3>
    <div class="map-card">
      <iframe id="venue-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title=""></iframe>
      <div class="map-info">
        <div class="addr"><b id="venue-name"></b><span id="venue-address"></span></div>
        <a class="btn" id="directions-btn" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>

  <div id="reception-event" style="margin-top:44px;">
    <h3 class="event-card"><span id="reception-icon"></span> <strong id="reception-heading"></strong></h3>
    <div class="map-card">
      <iframe id="reception-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title=""></iframe>
      <div class="map-info">
        <div class="addr"><b id="reception-name"></b><span id="reception-address"></span></div>
        <a class="btn" id="reception-directions-btn" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>
</section>

<footer>
  <span class="script" id="footer-script"></span>
  <span class="monogram" id="footer-monogram"></span>
</footer>

<!-- ============================================================
     SCRIPT
     ============================================================ -->
<script>
(function(){

  /* ---------- load wedding.json, then build the page ---------- */
  fetch('wedding.json', { cache: 'no-cache' })
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(init)
    .catch(function(err){
      console.error('Could not load wedding.json:', err);
      const note = document.createElement('div');
      note.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:200;padding:10px 16px;background:#4A121C;color:#fff;font:18px Oriya MN,sans-serif;text-align:center';
      note.textContent = 'Could not load wedding.json — serve this folder over http(s) (e.g. GitHub Pages or "python3 -m http.server"); fetch() is blocked on file://.';
      document.body.appendChild(note);
    });

  /* ---------- <head>: title, description, Open Graph, Twitter ---------- */
  function upsertMeta(attr, key, content){
    if(!content) return;
    let el = document.head.querySelector('meta[' + attr + '="' + key + '"]');
    if(!el){ el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
    el.setAttribute('content', content);
  }
  function applyMeta(M){
    const abs = (u) => u ? new URL(u, (M.siteUrl || location.href)).href : '';
    if(M.lang) document.documentElement.lang = M.lang;
    document.title = M.title;
    upsertMeta('name','description', M.description);
    upsertMeta('name','keywords', M.keywords);
    upsertMeta('name','author', M.author);
    upsertMeta('name','theme-color', M.themeColor);
    if(M.siteUrl){
      let link = document.head.querySelector('link[rel="canonical"]');
      if(!link){ link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }
      link.href = M.siteUrl;
      upsertMeta('property','og:url', M.siteUrl);
    }
    const og = M.og || {}, tw = M.twitter || {};
    upsertMeta('property','og:type', og.type);
    upsertMeta('property','og:title', og.title);
    upsertMeta('property','og:description', og.description);
    upsertMeta('property','og:image', abs(og.image));
    upsertMeta('property','og:image:alt', og.imageAlt);
    upsertMeta('property','og:site_name', og.siteName);
    upsertMeta('property','og:locale', og.locale);
    upsertMeta('name','twitter:card', tw.card);
    upsertMeta('name','twitter:title', tw.title);
    upsertMeta('name','twitter:description', tw.description);
    upsertMeta('name','twitter:image', abs(tw.image));
    upsertMeta('name','twitter:image:alt', tw.imageAlt);
  }

  function init(CONFIG){

  const couple = CONFIG.couple, hero = CONFIG.hero, ev = CONFIG.events;
  const reception = ev.reception || ev.reception1;
  const fullNames = couple.partner1 + " " + couple.connector + " " + couple.partner2;
  const setText = (id, text) => { document.getElementById(id).textContent = text; };

  applyMeta(CONFIG.meta);
  if(CONFIG.page.backgroundImage) document.documentElement.style.setProperty('--bg-image', 'url("' + CONFIG.page.backgroundImage + '")');

  document.getElementById('hero-eyebrow-arc').setAttribute('aria-label', hero.eyebrow);
  setText('hero-p1', couple.partner1);
  setText('hero-p2', couple.partner2);
  document.querySelector('.hero-names .amp').textContent = couple.connector;
  setText('hero-sub', hero.subtitle);
  const dateEl = document.getElementById('hero-date');
  const dateParts = hero.displayDate.split(/\s*·\s*/);
  dateEl.replaceChildren();
  if(dateParts.length > 1){
    const day = document.createElement('span');
    const time = document.createElement('span');
    day.textContent = dateParts.slice(0,-1).join(' · ');
    time.className = 'date-time';
    time.textContent = dateParts[dateParts.length - 1];
    dateEl.append(day,time);
  }else dateEl.textContent = hero.displayDate;
  dateEl.setAttribute('aria-label',hero.displayDate);
  setText('scroll-cue', hero.scrollCue);
  setText('gallery-eyebrow', CONFIG.gallery.eyebrow);
  setText('gallery-title', CONFIG.gallery.title);
  setText('gallery-subtitle', CONFIG.gallery.subtitle);

  const v = CONFIG.video;
  setText('video-heading', v.heading);
  const vLink = document.getElementById('video-link');
  vLink.href = v.url;
  vLink.setAttribute('aria-label', v.ariaLabel);
  const vThumb = document.getElementById('video-thumb');
  vThumb.src = 'https://img.youtube.com/vi/' + v.youtubeId + '/hqdefault.jpg';
  vThumb.alt = v.thumbnailAlt;

  setText('venue-eyebrow', CONFIG.venueSection.eyebrow);
  setText('venue-title', CONFIG.venueSection.title);
  document.getElementById('directions-btn').textContent = CONFIG.venueSection.directionsLabel;
  document.getElementById('reception-directions-btn').textContent = CONFIG.venueSection.directionsLabel;

  setText('ceremony-icon', ev.ceremony.icon);
  setText('ceremony-heading', ev.ceremony.title + " — " + ev.ceremony.displayDate);
  setText('reception-icon', reception.icon);
  setText('reception-heading', reception.title + " — " + reception.displayDate);
  document.getElementById('reception-event').hidden = reception.enabled === false;
  document.getElementById('venue-map').title = ev.ceremony.mapTitle;
  document.getElementById('reception-map').title = reception.mapTitle;

  setText('footer-script', CONFIG.footer.script);
  setText('footer-monogram', fullNames);

  /* Reveal the hero in order: photo, wheel, curved type, names, then details. */
  (function animateHeroInOrder(){
    const wheel = document.querySelector('.hero-wheel');
    const eyebrow = document.getElementById('hero-eyebrow');
    const names = document.querySelector('.hero-names');
    const details = document.querySelector('.hero-details');
    const phrase = hero.eyebrow || '';
    let started = false;
    const overlapDelay = 750; // start the next reveal halfway through a 1.5-second transition
    let namesStarted = false;
    function revealNames(){
      if(namesStarted) return;
      namesStarted = true;
      names.classList.add('is-visible');
      details.classList.add('is-visible');
    }
    eyebrow.textContent = phrase;
    function revealWheel(){
      if(started) return;
      started = true;
      wheel.classList.add('is-visible');
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){
        wheel.classList.add('is-typing');
        names.classList.add('is-visible');
        details.classList.add('is-visible');
      }else{
        setTimeout(() => {
          wheel.classList.add('is-typing');
          setTimeout(revealNames,overlapDelay);
        },overlapDelay);
      }
    }
    if(CONFIG.page.backgroundImage){
      const background = new Image();
      background.onload = revealWheel;
      background.onerror = revealWheel;
      background.src = CONFIG.page.backgroundImage;
      if(background.complete) revealWheel();
    }else revealWheel();
  })();

  /* ---------- countdown ---------- */
  const target = new Date(hero.weddingDateISO).getTime();
  function tick(){
    const now = Date.now();
    const diff = target - now;
    const els = { d: document.getElementById('cd-d'), h: document.getElementById('cd-h'),
                  m: document.getElementById('cd-m'), s: document.getElementById('cd-s') };
    if(diff <= 0){
      els.d.textContent = "0"; els.h.textContent = "00"; els.m.textContent = "00"; els.s.textContent = "00";
      document.querySelector('.scroll-cue').textContent = hero.scrollCueAfterWedding;
      return;
    }
    const d = Math.floor(diff/86400000);
    const h = Math.floor((diff%86400000)/3600000);
    const m = Math.floor((diff%3600000)/60000);
    const s = Math.floor((diff%60000)/1000);
    els.d.textContent = d;
    els.h.textContent = String(h).padStart(2,'0');
    els.m.textContent = String(m).padStart(2,'0');
    els.s.textContent = String(s).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- gallery ---------- */
  let currentIndex = 0;
  const gallery = CONFIG.gallery.photos;

  (function renderGallery(){
    const grid = document.getElementById('gallery-grid');
    grid.innerHTML = gallery.map((g,i) => `
      <figure data-index="${i}">
        <img src="${g.url}" alt="${g.caption || ''}" loading="lazy">
      </figure>
    `).join('');
    grid.querySelectorAll('figure').forEach(fig=>{
      fig.addEventListener('click', ()=> openLightbox(parseInt(fig.dataset.index,10)));
    });
  })();

  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCap = document.getElementById('lb-caption');
  
  function openLightbox(i){
    currentIndex = i;
    updateLightbox();
    lb.classList.add('open');
  }
  
  function updateLightbox(){
    const item = gallery[currentIndex];
    lbImg.src = item.url;
    lbImg.alt = item.caption || '';
    lbCap.textContent = item.caption || '';
  }
  
  function closeLightbox(){ lb.classList.remove('open'); }
  
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', ()=>{
    currentIndex = (currentIndex - 1 + gallery.length) % gallery.length;
    updateLightbox();
  });
  document.getElementById('lb-next').addEventListener('click', ()=>{
    currentIndex = (currentIndex + 1) % gallery.length;
    updateLightbox();
  });
  lb.addEventListener('click', (e)=>{ if(e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{
    if(!lb.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') document.getElementById('lb-prev').click();
    if(e.key === 'ArrowRight') document.getElementById('lb-next').click();
  });

  /* ---------- map setup (no API key — public embed) ---------- */
  (function setupMap(){
    const { lat, lng, zoom, name, address } = ev.ceremony.venue;
    document.getElementById('venue-map').src = `https://maps.google.com/maps?q=${lat},${lng}&z=${zoom}&output=embed`;
    document.getElementById('venue-name').textContent = name;
    document.getElementById('venue-address').textContent = address;
    document.getElementById('directions-btn').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

    const r = reception.venue;
    document.getElementById('reception-map').src = `https://maps.google.com/maps?q=${r.lat},${r.lng}&z=${r.zoom}&output=embed`;
    document.getElementById('reception-name').textContent = r.name;
    document.getElementById('reception-address').textContent = r.address;
    document.getElementById('reception-directions-btn').href = `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;
  })();

  /* Stagger content as each section enters view. */
  (function setupEntranceAnimations(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
    const items = document.querySelectorAll('.gallery-wrap .section-head, .gallery-grid figure, .teaser-wrap, #venue > .section-head, #venue > div, footer > *');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, {threshold:.12,rootMargin:'0px 0px -3% 0px'});
    items.forEach((item,index) => {
      item.classList.add('scroll-reveal');
      item.style.setProperty('--reveal-delay', Math.min(index % 6,5) * 100 + 'ms');
      observer.observe(item);
    });
    document.querySelectorAll('.countdown .cd-box').forEach((item,index) => item.style.setProperty('--item-delay',index * 120 + 'ms'));
  })();

  } /* end init */

})();
</script>
</body>
</html>
